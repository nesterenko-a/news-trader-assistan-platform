services:
  db:
    image: postgres:13.3
    container_name: newstrader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newstrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newstrader"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
