<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NewsTrader Assistant{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">NewsTrader <span>Assistant</span></a>
      <nav>
        <a href="/">Аналитика</a>
        <a href="/watchlist">Watchlist</a>
        <a href="/portfolio">Портфель</a>
        <a href="/alerts">Алерты</a>
        <a href="/docs">API</a>
        {% if user %}
        <span class="user">{{ user.username }} · <a href="/logout">Выйти</a></span>
        {% else %}
        <a href="/login">Войти</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Материалы носят информационный характер и не являются инвестиционной рекомендацией.
  </footer>
</body>
</html>
