<section id="broker-accounts-{{ broker.environment }}" class="broker-account-section" aria-label="Счета брокера"><div class="broker-account-list">
  {% for account in broker.accounts %}
    <article class="broker-account{% if account.id == broker.selected_account_id %} selected{% endif %}">
      <form method="post" action="/broker/t-invest/select">
        <input type="hidden" name="environment" value="{{ broker.environment }}"><input type="hidden" name="account_id" value="{{ account.id }}">
        <button class="broker-account-choice" type="submit" aria-pressed="{{ 'true' if account.id == broker.selected_account_id else 'false' }}" aria-label="Выбрать счёт {{ account.name }}">
          <span class="broker-account-name" role="heading" aria-level="3">{{ account.name }}</span>
          <span class="muted">{{ account.masked_id }}{% if account.balance is defined and account.balance is not none %}{% for cash in account.balance %} · {{ cash.amount }} {{ cash.currency }}{% endfor %}{% else %} · Баланс ещё не загружен{% endif %}</span>
        </button>
      </form>
    </article>
  {% else %}<p class="muted">Нет доступных счетов.</p>{% endfor %}
</div></section>
